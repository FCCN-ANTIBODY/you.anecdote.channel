# residency.yml — what this engine asks of a host that mounts it. The resident's NAME is not
# declared here: it comes from the mount path, so `.you-engine` is the claim.
version: 1
resident: you

# WHAT THIS ENGINE ASKS A HOST TO HOLD. Labels, never locations -- the same discipline
# `.ablative-engine` states: "The path becomes a binding the host answers." An engine that carried
# these itself would be code with one operator's website baked into it, which is what this engine
# did until 2026-09-22 and no other engine on a station does.
wants:
  - label: instance
    holds: "which site this deployment is: its origin, which is also the RP ID every passkey minted here is bound to, permanently"
    lifecycle: durable
    disposition: on-request

  - label: arrangement
    holds: "who may open a sealed bottle here -- one age recipient per line, written by a person"
    lifecycle: durable
    disposition: private

  - label: channels
    holds: "the index of channels this control point answers for"
    lifecycle: durable
    disposition: on-request

  - label: bottles
    holds: "published artifacts -- the bundle, the GIF, the manifest. Derived: regenerated by bin/publish, never authored"
    lifecycle: transient
    disposition: on-request

# Nothing to run. A control point publishes and guides; it is not a service.
serves: []

# WIZARDS ARE A DECLARATION INSIDE RESIDENCY (library.anecdote.channel, ruled 2026-09-21): another
# reason to want residency, not another relationship. A wizard is referenced by LABEL, never by
# pin — the host resolves `<engine> + <label>` to whatever head this engine has, so nothing that
# asks for one carries a version. A grant targets that same pair; once inside, workflow labels are
# namespaced by the wizard, so two wizards may reuse a word.
#
# THIS ENGINE ONLY ONBOARDS. A project's own wizard comes from the engine that owns the capability --
# a project on stagecraft is handed a wizard declared in .stagecraft-engine's residency, and the
# grant targets THAT engine plus THAT label. So `wizards:` is a general residency block, and the
# second wizard anyone meets will come from a different engine than the first.
wizards:
  - label: greet
    for: "onboarding at the you subdomain — staff or a client: bind a first passkey here, then open what is sealed to it"
    entry: wizards/greet/README.md        # the onboarding; steps are sub-resources it employs
    shape: onboarding                      # owner-bind / sub-key / client are GRANT shapes, decided by the grant, not here
    workflow: [bind-key, open-sealed, read]
    constitution: wizards/greet/CONSTITUTION.md
