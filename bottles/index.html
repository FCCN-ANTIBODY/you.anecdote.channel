<!doctype html>
<html lang="en">
<!-- bottles/ — the consumer page. The bottle is the logo; what is INSIDE it is the site.
     The control bottle (a GIF of QR frames) is read out of its own pixels, camera off, and its files
     are rendered by jekyll-enough from source in this tab, with one injected data file, _data/you.json,
     that says what this browser holds. README.md is the default page and the whole guided experience;
     links resolve only into the bottle. Tapping the logo makes the bottle big; tapping again sends it
     away. The station-side readouts sit under "how this got here", off to the side. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/icon.svg">
<title>you</title>
<style>
  :root { color-scheme: light dark; --bar: 3.4rem; }
  body { margin: 0; font: 16px/1.6 system-ui, sans-serif; }
  .bar { position: fixed; inset: 0 0 auto 0; height: var(--bar); display: flex; align-items: center; gap: .8rem; padding: 0 .8rem; background: Canvas; border-bottom: 1px solid rgba(127,127,127,.35); z-index: 5; }
  .bar img { width: 2.6rem; height: 2.6rem; image-rendering: pixelated; border: 1px solid rgba(127,127,127,.5); cursor: pointer; }
  .bar b { font-size: 1.1rem; } .chip { font-size: .8rem; opacity: .7; }
  #big[hidden] { display: none; }
  #big { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 9; cursor: pointer; color: #eee; }
  #big img { width: min(88vw, 88vh); image-rendering: pixelated; border: 6px solid #fff; }
  main { max-width: 42rem; margin: 0 auto; padding: calc(var(--bar) + 1rem) 1rem 3rem; }
  main h1 { font-size: 1.5rem; } main h2 { font-size: 1.15rem; margin-top: 1.8rem; }
  code { font-family: ui-monospace, Menlo, monospace; font-size: .92em; } pre { background: rgba(127,127,127,.12); padding: .7rem; overflow-x: auto; white-space: pre-wrap; }
  .act { display: inline-block; padding: .55rem 1rem; margin: .3rem .3rem .3rem 0; border: 1px solid currentColor; border-radius: .5rem; text-decoration: none; font-weight: 600; }
  .act.muted { opacity: .65; font-weight: 400; }
  .recipient code { word-break: break-all; } .muted { opacity: .7; } .ok { color: #1a7f37; } .bad { color: #b42318; }
  canvas.still { image-rendering: pixelated; max-width: 100%; margin: .4rem 0 1rem; }
  details { max-width: 42rem; margin: 0 auto 3rem; padding: 0 1rem; opacity: .8; } details dl { display: grid; grid-template-columns: max-content 1fr; gap: .15rem .8rem; font-size: .9rem; } details dt { opacity: .65; }
</style>
<body>
<header class="bar"><img id="logo" src="control.gif" alt="the bottle — tap to see it big"><div><b>you</b><br><span id="chip" class="chip">reading the bottle…</span></div></header>
<div id="big" hidden><img src="control.gif" alt="the bottle, big"><p>that is the whole payload, playing. tap to send it back.</p></div>
<main id="page"><p class="muted">Reading the bottle out of its pixels…</p></main>
<details id="how"><summary>how this got here</summary><div id="out" class="muted">…</div></details>

<script type="module">
import { unbottle } from "../bottle/bottle.mjs";
import { parseBundle } from "../bottle/bundle.mjs";
import { readPack } from "../anecdote.channel/git-enough/unpack.mjs";
import { parseCommit, filesAt } from "../anecdote.channel/git-enough/read.mjs";
import { defaultHash } from "../anecdote.channel/composer/anecdote.mjs";
import { decrypt } from "../anecdote.channel/composer/age-seal.mjs";
import { encodeQR } from "../anecdote.channel/composer/qr-encode.mjs";
import { buildSite } from "../anecdote.channel/jekyll-enough/build.mjs";
import { render as renderMarkdown } from "../anecdote.channel/press/markdown-more.mjs";
import { capabilities, enroll, derive, mintFallback } from "../bottle/you-key.mjs";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const td = new TextDecoder();
const chip = (t, cls = "") => { $("chip").className = "chip " + cls; $("chip").textContent = t; };
$("logo").onclick = () => { $("big").hidden = false; }; $("big").onclick = () => { $("big").hidden = true; };

// ---- state: what this browser holds, injected into the bottle's tree as _data/you.json ----------------
const cap = capabilities();
const state = { secure: cap.secure, webauthn: cap.webauthn, credId: !!cap.credId, held: false, source: null, recipient: null, enrolled_here: false,
                sealed: { published: false, stanzas: 0, recipients: [], opened: false, refused: false },
                bottle: { ref: "", tip: "", tip_short: "", frames: 0, by: "", by_short: "", files: [] } };
let held = null, tree = {}, manifest = null, sealedManifest = null, how = [];

// ---- read the clear bottle ------------------------------------------------------------------------
async function readBottle(gifFile, sealedFlag) {
  const gif = new Uint8Array(await (await fetch(gifFile, { cache: "no-store" })).arrayBuffer());
  const u = await unbottle(gif);
  if (!u.ok) throw new Error("the bottle did not verify: " + u.errors.join("; "));
  return u;
}
async function openBundle(bytes, sealedFlag) {
  const b = parseBundle(bytes);
  const { objects, count } = await readPack(b.pack);
  const tip = b.refs[0];
  const files = filesAt(objects, tip.oid);
  for (const f of files) {
    const o = objects.get(f.oid); if (!o) continue;
    tree[f.path] = td.decode(o.content);
    const i = state.bottle.files.findIndex((x) => x.path === f.path);
    const meta = { path: f.path, bytes: o.content.length, sealed: !!sealedFlag };
    if (i >= 0) state.bottle.files[i] = meta; else state.bottle.files.push(meta);
  }
  return { b, tip, count, commit: parseCommit(objects.get(tip.oid).content), files };
}

try {
  manifest = await (await fetch("control.json", { cache: "no-store" })).json();
  const u = await readBottle(manifest.gif.file);
  const sha = await defaultHash(u.bytes);
  const { b, tip, count, commit } = await openBundle(u.bytes, false);
  Object.assign(state.bottle, { ref: tip.ref, tip: tip.oid, tip_short: tip.oid.slice(0, 7), frames: u.frames, by: u.by, by_short: u.by.slice(0, 27) });
  how.push(`<dl><dt>published</dt><dd><code>${esc(manifest.ref)}</code> at <code>${esc(manifest.tip.slice(0, 7))}</code>, ${esc(manifest.created)}</dd>
    <dt>bottle</dt><dd><a href="${esc(manifest.gif.file)}">${esc(manifest.gif.file)}</a> · ${manifest.gif.bytes} bytes · ${manifest.gif.frames} frames of v${manifest.gif.version}</dd>
    <dt>read back</dt><dd>${u.decoded} of ${u.frames} frames · <span class="ok">verified</span> · by <code>${esc(u.by)}</code> ${u.by === manifest.transfer.by ? '<span class="ok">as published</span>' : '<span class="bad">differs</span>'}</dd>
    <dt>bytes</dt><dd>${u.bytes.length} · <code>${esc(sha.slice(0, 23))}…</code> ${sha === manifest.bundle.sha256 ? '<span class="ok">the GIF is the bytes</span>' : '<span class="bad">mismatch</span>'} · <a href="${esc(manifest.bundle.file)}">${esc(manifest.bundle.file)}</a></dd>
    <dt>inside</dt><dd>${b.refs.map((r) => `<code>${esc(r.ref)}</code> → <code>${esc(r.oid.slice(0, 7))}</code>`).join(", ")} · ${count} objects · <code>${esc(String(commit.message).trim())}</code> · no prerequisites: the whole branch</dd></dl>`);
  try { const r = await fetch("control.sealed.json", { cache: "no-store" }); if (r.ok) { sealedManifest = await r.json(); Object.assign(state.sealed, { published: true, stanzas: sealedManifest.sealed.stanzas, recipients: sealedManifest.sealed.recipients }); } } catch {}
  chip("bottle read · " + state.bottle.files.length + " files", "ok");
  $("out").innerHTML = how.join("");
  route();
} catch (e) { chip("could not read the bottle", "bad"); $("page").innerHTML = `<p class="bad">${esc(e && e.message || e)}</p>`; }

// ---- render: jekyll-enough over the bottle's tree, with what this browser holds ----------------------
function build() {
  const gaps = [];
  const out = buildSite({ ...tree, "_data/you.json": JSON.stringify(state) }, { lenient: true, gaps, renderMarkdown });
  return { out, gaps };
}
function route() {
  const want = (location.hash.replace(/^#\/?/, "") || "README.md");
  if (!(want in tree)) { $("page").innerHTML = `<h1>did not answer</h1><p><code>${esc(want)}</code> is not in the bottle. <a href="#/README.md">back to the start</a>.</p>`; return; }
  const { out, gaps } = build();
  const key = "_site/" + want.replace(/\.md$/, ".html");
  let html = out[key];
  if (html == null) html = `<pre>${esc(tree[want])}</pre>`;                 // a file with no front matter is shown as itself
  $("page").innerHTML = html + (gaps.length ? `<p class="muted">the engine lacked: ${esc([...new Set(gaps)].join(", "))}</p>` : "");
  const r = $("page").querySelector(".recipient");
  if (r && held) { const q = encodeQR(held.recipient, { ecLevel: "M" }), m = 5, quiet = 4, px = (q.size + 2 * quiet) * m; const c = document.createElement("canvas"); c.className = "still"; c.width = c.height = px; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, px, px); g.fillStyle = "#000"; for (let y = 0; y < q.size; y++) for (let x = 0; x < q.size; x++) if (q.modules[y][x]) g.fillRect((x + quiet) * m, (y + quiet) * m, m, m); r.after(c); }
  window.scrollTo(0, 0);
}
addEventListener("hashchange", () => { if (!location.hash.startsWith("#you/")) route(); });

// ---- the wizard's verbs: links in the README, answered here -------------------------------------------
document.addEventListener("click", async (ev) => {
  const a = ev.target.closest("a[href^='#you/']"); if (!a) return;
  ev.preventDefault();
  const verb = a.getAttribute("href").slice(5);
  try {
    if (verb === "enroll") { const r = await enroll(); state.credId = r.enabled; if (!r.enabled) throw new Error("this authenticator refused prf; the credential cannot derive. Use the fallback or another device."); chip("passkey minted — now derive", "ok"); }
    else if (verb === "derive" || verb === "fallback") { held = verb === "derive" ? await derive() : await mintFallback(); Object.assign(state, { held: true, source: held.source, recipient: held.recipient }); await checkArrangement(); chip("key held (" + held.source + ")", "ok"); if (state.sealed.published) await openSealed(); }
    else if (verb === "open") { await openSealed(); }
  } catch (e) { chip(e.message, "bad"); }
  route();
});
async function checkArrangement() {
  try { const t = await (await fetch("/recipients.txt", { cache: "no-store" })).text(); state.enrolled_here = held && t.split("\n").some((l) => l.replace(/#.*/, "").split(/\s+/).includes(held.recipient)); } catch {}
}
async function openSealed() {
  if (!sealedManifest || !held || state.sealed.opened) return;
  const u = await readBottle(sealedManifest.gif.file, true);
  let opened;
  try { opened = await decrypt(held.identity, u.bytes); } catch { state.sealed.refused = true; chip("the sealed bottle refused this key", "bad"); return; }
  await openBundle(opened, true);
  state.sealed.opened = true; state.sealed.refused = false;
  chip("sealed bottle opened · " + state.bottle.files.length + " files", "ok");
}
</script>
</body>
</html>
