# you.yml — where THIS instance of the keeper is served, and what that fixes.
#
# The engine is `you.anecdote.channel` (NAME). An instance is a deployment of it at
# some origin, and the origin is the one thing about an instance that cannot be
# changed afterwards: a WebAuthn credential bakes the RP ID in at creation
# (anecdote.channel docs/decisions.md, D12), so `url:` is a decide-once field.
# Mirror of `.tell-engine/tell.yml`, one namespace over.
#
# index.html does NOT read this at runtime. The page asks `location` what it is, so
# the site and this file cannot drift apart silently; it fetches this file only to
# show which origin was MEANT beside the one it is actually at.

version: 1
id: you
name: "you — the control point"

# The control point site root. The RP ID is this host. Decide-once.
url: "https://you.discoverywritten.com"

# The engine's canonical address. Not served, and not important yet (operator,
# 2026-09-21): this repository matters today for its `-engine` property, as the
# official configurator of a control point on station-node.
#
# NAME says the INSTANCE -- where someone expects to find this deployment -- and
# never the engine: an instance of an engine never carries the name of somebody
# else's property. A canonical you.anecdote.channel site would carry its own.
engine: "https://you.anecdote.channel"

# Where it deploys: wrangler.jsonc, which wrangler reads itself. The project was made
# in the dashboard on 2026-09-21 with no git provider; deploys come from here (bin/deploy).

# The branch whose HEAD is what gets bundled and published. Force-pushed on purpose:
# it carries one commit and no history, so killing it revokes everything at once, and
# an empty branch of any age publishes the same bytes as any other empty branch.
control_branch: control

# A secure-context origin for PROBING only — does `prf` answer on this phone? Never
# mint a credential here that anyone is meant to keep: it binds to the wrong RP ID.
probe_origin: "https://station.opaleye-beaufort.ts.net"
